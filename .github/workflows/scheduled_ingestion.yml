name: Scheduled Ingestion

on:
  schedule:
    # Run at 06:00 UTC every weekday (Mon–Fri) — before US market open
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      tickers:
        description: "Space-separated tickers (leave empty for default watchlist)"
        required: false
        default: ""
      rss_only:
        description: "RSS only (skip EDGAR download)"
        type: boolean
        required: false
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ inputs.rss_only }}" = "true" ]; then
            FLAGS="--rss-only"
          else
            FLAGS=""
          fi

          if [ -n "${{ inputs.tickers }}" ]; then
            python scripts/run_ingestion.py $FLAGS --tickers ${{ inputs.tickers }}
          else
            python scripts/run_ingestion.py $FLAGS
          fi

      - name: Rebuild FAISS index (if new filings were added)
        run: python scripts/build_index.py

      - name: Commit updated data
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sentiment.db data/faiss_index/ data/eval_results.json || true
          git diff --staged --quiet || git commit -m "auto: ingestion $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
